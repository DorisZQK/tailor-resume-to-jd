<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__DOCUMENT_TITLE__</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #687386;
      --line: #d8dee8;
      --brand: #3156d3;
      --brand-soft: #edf1ff;
      --warning: #9a5b13;
      --paper: #fff;
      --canvas: #eef1f6;
      --panel: #f8f9fc;
    }

    * { box-sizing: border-box; }

    html { background: var(--canvas); }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--canvas);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    button:focus-visible,
    [contenteditable="true"]:focus-visible {
      outline: 3px solid rgba(49, 86, 211, .25);
      outline-offset: 2px;
    }

    .app-toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 20px;
      color: #fff;
      background: #172139;
      box-shadow: 0 2px 12px rgba(16, 24, 40, .16);
    }

    .brand { margin-right: auto; }
    .brand strong { display: block; font-size: 15px; }
    .brand span { color: #bcc7df; font-size: 11px; }
    .toolbar-actions { display: flex; align-items: center; gap: 8px; }

    .tool-button {
      min-height: 36px;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 8px;
      padding: 7px 12px;
      color: #eef2ff;
      background: rgba(255, 255, 255, .08);
      cursor: pointer;
    }

    .tool-button:hover:not(:disabled) { background: rgba(255, 255, 255, .16); }
    .tool-button:disabled { opacity: .42; cursor: not-allowed; }
    .tool-button.primary { border-color: #6e8cff; background: var(--brand); font-weight: 700; }
    .save-status { min-width: 72px; color: #b8e6cf; font-size: 12px; text-align: right; }

    .workspace {
      width: min(1440px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 28px;
      padding: 28px;
      align-items: start;
    }

    .job-panel {
      position: sticky;
      top: 86px;
      max-height: calc(100vh - 114px);
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      background: var(--panel);
      box-shadow: 0 8px 28px rgba(28, 39, 61, .07);
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--brand);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .job-panel h1 { margin: 0; font-size: 22px; line-height: 1.3; }
    .job-company { margin: 7px 0 20px; color: var(--muted); font-size: 13px; }
    .panel-section { padding: 15px 0; border-top: 1px solid var(--line); }
    .panel-section h2 { margin: 0 0 9px; font-size: 13px; }
    .panel-section p { margin: 0; color: #4b5567; font-size: 12px; line-height: 1.65; }
    .keyword-list { display: flex; flex-wrap: wrap; gap: 7px; }

    .keyword {
      border-radius: 999px;
      padding: 5px 9px;
      color: #2445b1;
      background: var(--brand-soft);
      font-size: 11px;
      font-weight: 700;
    }

    .panel-list { margin: 0; padding-left: 18px; color: #4b5567; font-size: 12px; line-height: 1.65; }
    .panel-list li + li { margin-top: 5px; }
    .review-count { color: var(--warning); }

    .privacy-note {
      margin: 4px 0 0;
      border-radius: 8px;
      padding: 10px;
      color: #566071;
      background: #eef1f5;
      font-size: 11px;
      line-height: 1.5;
    }

    .resume-stage { min-width: 0; display: grid; justify-items: center; gap: 12px; }

    .page-warning {
      width: min(210mm, 100%);
      border: 1px solid #f0c98f;
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--warning);
      background: #fff8eb;
      font-size: 12px;
    }

    .page-warning[hidden] { display: none; }

    .resume-page {
      width: 210mm;
      height: 297mm;
      padding: 8.5mm 10mm 7.5mm;
      color: #111;
      background: var(--paper);
      box-shadow: 0 16px 45px rgba(28, 39, 61, .12);
      caret-color: var(--brand);
      font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    .resume-header {
      min-height: 32mm;
      display: grid;
      grid-template-columns: 1fr 30mm;
      gap: 12mm;
      align-items: start;
    }

    .resume-name {
      margin: 4mm 0 4mm;
      color: #050505;
      font-size: 31px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: .04em;
    }

    .contact-row { min-height: 16px; font-size: 10.5px; font-weight: 700; }
    .contact-separator { color: #8a93a2; }
    .candidate-summary { margin: 2.2mm 0 0; font-size: 10px; line-height: 1.45; }
    .missing-info-row { display: flex; gap: 6px; margin-top: 4px; }

    .missing-info,
    .review-badge {
      display: inline-block;
      border-radius: 999px;
      padding: 2px 7px;
      color: #85500e;
      background: #fff1c8;
      font-size: 9px;
      font-weight: 700;
    }

    .photo-uploader {
      position: relative;
      width: 27mm;
      height: 34mm;
      justify-self: end;
      background: #fff;
    }

    .photo-upload-trigger {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px dashed #a8afba;
      border-radius: 3px;
      padding: 0;
      color: #707782;
      background: #f4f5f7;
      font-size: 10px;
      line-height: 1.35;
      cursor: pointer;
    }

    .photo-empty-state small { display: block; margin-top: 4px; font-size: 8px; }
    .photo-image {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      object-fit: cover;
    }
    .photo-image[hidden], .photo-empty-state[hidden], .photo-controls[hidden] { display: none; }

    .photo-controls {
      position: absolute;
      right: 2px;
      bottom: 2px;
      display: flex;
      gap: 3px;
    }

    .photo-controls button {
      border: 0;
      border-radius: 3px;
      padding: 2px 4px;
      color: #fff;
      background: rgba(23, 32, 51, .82);
      font-size: 8px;
      cursor: pointer;
    }

    .resume-section { margin-top: 3.2mm; }

    .section-title {
      margin: 0 0 2mm;
      border-bottom: 1.5px solid #4a5568;
      padding-bottom: 1mm;
      color: #18233a;
      font-size: 14px;
      line-height: 1.2;
    }

    .resume-meta-row,
    .experience-meta {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: baseline;
      font-size: 10.5px;
      line-height: 1.45;
    }

    .resume-subline, .resume-detail { margin: .7mm 0 0; font-size: 10px; line-height: 1.45; }
    .education-list, .project-list { display: grid; gap: 1.5mm; }
    .experience-entry + .experience-entry { margin-top: 2mm; }

    .experience-group-title {
      margin: 1.1mm 0 .6mm;
      font-size: 10.5px;
      line-height: 1.35;
    }

    .resume-list {
      margin: 0;
      padding-left: 5mm;
      color: #111;
      font-size: 10px;
      line-height: 1.45;
    }

    .resume-list li + li { margin-top: .6mm; }
    .compact-list { margin: .8mm 0 0; padding-left: 5mm; }
    .skills-list { margin-top: 1mm; }

    .editable-block { position: relative; min-height: 24px; }

    .editable-block:hover,
    .editable-block:focus-within,
    .editable-block.is-dragging,
    .editable-block.is-resizing {
      outline: 1px dashed #8ca0d8;
      outline-offset: 2px;
    }

    .block-drag-handle,
    .block-resize-handle {
      position: absolute;
      z-index: 3;
      margin: 0;
      border: 0;
      padding: 0;
      opacity: 0;
      color: var(--brand);
      transition: opacity .12s ease;
    }

    .editable-block:hover > .block-drag-handle,
    .editable-block:hover > .block-resize-handle,
    .editable-block:focus-within > .block-drag-handle,
    .editable-block:focus-within > .block-resize-handle { opacity: 1; }

    .block-drag-handle {
      left: -18px;
      top: 2px;
      width: 15px;
      height: 18px;
      border-radius: 3px;
      background: var(--brand-soft);
      font-size: 12px;
      line-height: 18px;
      cursor: grab;
      touch-action: none;
    }

    .block-resize-handle {
      right: -2px;
      bottom: -2px;
      width: 10px;
      height: 10px;
      border-right: 2px solid var(--brand);
      border-bottom: 2px solid var(--brand);
      background: transparent;
      cursor: ns-resize;
      touch-action: none;
    }

    .review-badge { margin-left: 6px; vertical-align: 1px; }

    .review-note {
      margin: 3px 0 2px;
      border-left: 3px solid #e6b450;
      border-radius: 4px;
      padding: 5px 7px;
      color: #75470d;
      background: #fff7df;
      font-size: 9px;
      line-height: 1.4;
    }

    .block-drop-indicator {
      height: 3px;
      margin: 2px 0;
      border-radius: 3px;
      background: var(--brand);
    }

    .visually-hidden {
      position: fixed;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 1060px) {
      .workspace { grid-template-columns: 1fr; padding: 18px; }
      .job-panel { position: static; max-height: none; }
      .resume-stage { overflow-x: auto; justify-items: start; }
    }

    @media (max-width: 700px) {
      .app-toolbar { align-items: flex-start; flex-wrap: wrap; padding: 10px 12px; }
      .brand { width: 100%; }
      .toolbar-actions { width: 100%; overflow-x: auto; }
      .save-status { margin-left: auto; }
      .workspace { padding: 12px; }
      .job-panel { padding: 16px; }
    }

    @page { size: A4; margin: 0; }

    @media print {
      html, body { width: 210mm; height: 297mm; margin: 0; background: #fff; }
      [data-resume-editor],
      [data-resume-editor] * { caret-color: transparent !important; }
      .app-toolbar,
      .job-panel,
      .page-warning,
      .save-status,
      .screen-only,
      .review-note,
      .review-badge,
      .missing-info,
      .photo-empty-state,
      .photo-controls,
      .block-drag-handle,
      .block-resize-handle,
      .block-drop-indicator,
      .visually-hidden { display: none !important; }
      .workspace { display: block; width: auto; margin: 0; padding: 0; }
      .resume-stage { display: block; }
      .resume-page { margin: 0; box-shadow: none; outline: none; }
      .photo-uploader,
      .photo-upload-trigger { border: 0 !important; background: #fff !important; }
      .photo-image:not([hidden]) { display: block !important; }
      .editable-block { outline: none !important; }
    }
  </style>
</head>
<body>
  <header class="app-toolbar">
    <div class="brand">
      <strong>岗位定制简历</strong>
      <span>本地编辑 · 自动保存 · 待核实 __UNRESOLVED_COUNT__ 项</span>
    </div>
    <div class="toolbar-actions" aria-label="简历编辑工具栏">
      <button class="tool-button" id="undoBtn" type="button" disabled>撤销</button>
      <button class="tool-button" id="redoBtn" type="button" disabled>重做</button>
      <button class="tool-button" id="resetBtn" type="button">恢复推荐版</button>
      <button class="tool-button primary" id="printBtn" type="button"
        data-unresolved-count="__UNRESOLVED_COUNT__">导出 PDF</button>
      <span class="save-status" id="saveStatus" aria-live="polite">推荐版本</span>
    </div>
  </header>

  <main class="workspace">
    <aside class="job-panel" aria-label="目标岗位信息">
      <!--TARGET_PANEL-->
    </aside>
    <section class="resume-stage" aria-label="简历编辑区">
      <p class="page-warning" id="pageWarning" hidden>
        当前内容已超出一页 A4。请精简文字或重置内容块高度后再导出。
      </p>
      <article class="resume-page" data-resume-editor contenteditable="true"
        role="textbox" aria-label="可编辑简历正文" aria-multiline="true" spellcheck="false">
        <!--RESUME_CONTENT-->
      </article>
    </section>
  </main>

  <input id="photoInput" class="visually-hidden" type="file" accept="image/*"
    aria-label="选择本地照片">

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = __STORAGE_KEY_JSON__;
      const DRAFT_VERSION = 1;
      const SAVE_DELAY = 300;
      const HISTORY_DELAY = 350;
      const MAX_HISTORY = 50;
      const MAX_PHOTO_BYTES = 10 * 1024 * 1024;
      const PHOTO_WIDTH = 600;
      const PHOTO_HEIGHT = 800;
      const PHOTO_QUALITY = 0.86;
      const MIN_BLOCK_HEIGHT = 24;
      const editor = document.querySelector('[data-resume-editor]');
      const photoInput = document.getElementById('photoInput');
      const undoBtn = document.getElementById('undoBtn');
      const redoBtn = document.getElementById('redoBtn');
      const resetBtn = document.getElementById('resetBtn');
      const printBtn = document.getElementById('printBtn');
      const unresolvedCount = Number.parseInt(printBtn.dataset.unresolvedCount, 10);
      const saveStatus = document.getElementById('saveStatus');
      const pageWarning = document.getElementById('pageWarning');
      const initialResumeHtml = editor.innerHTML;
      let saveTimer = 0;
      let historyTimer = 0;
      let history = [];
      let historyIndex = -1;
      let applyingHistory = false;
      let dragState = null;
      let resizeState = null;

      function setSaveStatus(message) {
        saveStatus.textContent = message;
      }

      function createDraftPayload() {
        return {
          version: DRAFT_VERSION,
          resumeHtml: editor.innerHTML,
          savedAt: new Date().toISOString()
        };
      }

      function saveDraft() {
        window.clearTimeout(saveTimer);
        setSaveStatus('正在保存…');
        saveTimer = window.setTimeout(() => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(createDraftPayload()));
            setSaveStatus('已保存');
          } catch (error) {
            const quotaExceeded = error &&
              (error.name === 'QuotaExceededError' || error.code === 22);
            setSaveStatus(quotaExceeded ? '本地空间不足' : '保存失败');
          }
        }, SAVE_DELAY);
      }

      function restoreDraft() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const draft = JSON.parse(raw);
          if (
            draft &&
            draft.version === DRAFT_VERSION &&
            typeof draft.resumeHtml === 'string' &&
            draft.resumeHtml.trim()
          ) {
            editor.innerHTML = draft.resumeHtml;
            setSaveStatus('已恢复草稿');
          }
        } catch (error) {
          setSaveStatus('草稿不可用，已载入推荐版');
        }
      }

      function compressPhoto(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(new Error('file-read-failed'));
          reader.onload = () => {
            const sourceImage = new Image();
            sourceImage.onerror = () => reject(new Error('image-decode-failed'));
            sourceImage.onload = () => {
              const canvas = document.createElement('canvas');
              canvas.width = PHOTO_WIDTH;
              canvas.height = PHOTO_HEIGHT;
              const context = canvas.getContext('2d');
              if (!context) {
                reject(new Error('canvas-unavailable'));
                return;
              }
              context.fillStyle = '#fff';
              context.fillRect(0, 0, PHOTO_WIDTH, PHOTO_HEIGHT);
              const targetRatio = PHOTO_WIDTH / PHOTO_HEIGHT;
              const sourceRatio = sourceImage.width / sourceImage.height;
              let sourceWidth = sourceImage.width;
              let sourceHeight = sourceImage.height;
              let sourceX = 0;
              let sourceY = 0;
              if (sourceRatio > targetRatio) {
                sourceWidth = sourceImage.height * targetRatio;
                sourceX = (sourceImage.width - sourceWidth) / 2;
              } else {
                sourceHeight = sourceImage.width / targetRatio;
                sourceY = (sourceImage.height - sourceHeight) / 2;
              }
              context.drawImage(
                sourceImage,
                sourceX,
                sourceY,
                sourceWidth,
                sourceHeight,
                0,
                0,
                PHOTO_WIDTH,
                PHOTO_HEIGHT
              );
              resolve(canvas.toDataURL('image/jpeg', PHOTO_QUALITY));
            };
            sourceImage.src = reader.result;
          };
          reader.readAsDataURL(file);
        });
      }

      function applyPhoto(dataUrl) {
        const uploader = editor.querySelector('[data-photo-uploader]');
        const image = uploader && uploader.querySelector('.photo-image');
        const emptyState = uploader && uploader.querySelector('.photo-empty-state');
        const controls = uploader && uploader.querySelector('.photo-controls');
        if (!uploader || !image || !emptyState || !controls) return;
        image.src = dataUrl;
        image.hidden = false;
        emptyState.hidden = true;
        controls.hidden = false;
      }

      async function handlePhotoFile(file) {
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          setSaveStatus('请选择图片文件');
          return;
        }
        if (file.size > MAX_PHOTO_BYTES) {
          setSaveStatus('图片不能超过 10 MB');
          return;
        }
        try {
          applyPhoto(await compressPhoto(file));
          commitAtomicChange('照片已更新');
        } catch (error) {
          setSaveStatus('照片读取失败');
        } finally {
          photoInput.value = '';
        }
      }

      function removePhoto() {
        const uploader = editor.querySelector('[data-photo-uploader]');
        const image = uploader && uploader.querySelector('.photo-image');
        const emptyState = uploader && uploader.querySelector('.photo-empty-state');
        const controls = uploader && uploader.querySelector('.photo-controls');
        if (!image || !emptyState || !controls || !image.hasAttribute('src')) return;
        image.removeAttribute('src');
        image.hidden = true;
        emptyState.hidden = false;
        controls.hidden = true;
        commitAtomicChange('照片已删除');
      }

      function bindPhotoControls() {
        const uploader = editor.querySelector('[data-photo-uploader]');
        const trigger = uploader && uploader.querySelector('.photo-upload-trigger');
        const replace = uploader && uploader.querySelector('[data-photo-action="replace"]');
        const remove = uploader && uploader.querySelector('[data-photo-action="remove"]');
        if (!trigger || !replace || !remove) return;
        trigger.onclick = () => photoInput.click();
        replace.onclick = (event) => {
          event.stopPropagation();
          photoInput.click();
        };
        remove.onclick = (event) => {
          event.stopPropagation();
          removePhoto();
        };
        photoInput.onchange = () => handlePhotoFile(photoInput.files && photoInput.files[0]);
      }

      function getGroupBlocks(group) {
        return Array.from(group.querySelectorAll('.editable-block')).filter(
          (candidate) => candidate.closest('[data-sortable-group]') === group
        );
      }

      function bindEditableBlocks() {
        editor.querySelectorAll('.editable-block').forEach((block) => {
          const dragHandle = block.querySelector(':scope > .block-drag-handle');
          const resizeHandle = block.querySelector(':scope > .block-resize-handle');
          if (!dragHandle || !resizeHandle) return;
          dragHandle.onpointerdown = (event) => startBlockDrag(event, block);
          dragHandle.onkeydown = (event) => {
            if (!event.altKey) return;
            if (event.key === 'ArrowUp') {
              event.preventDefault();
              moveBlockByKeyboard(block, -1);
            } else if (event.key === 'ArrowDown') {
              event.preventDefault();
              moveBlockByKeyboard(block, 1);
            }
          };
          resizeHandle.onpointerdown = (event) => startBlockResize(event, block);
          resizeHandle.ondblclick = (event) => {
            event.preventDefault();
            resetBlockHeight(block);
          };
        });
      }

      function startBlockDrag(event, block) {
        if (event.button !== undefined && event.button !== 0) return;
        const group = block.closest('[data-sortable-group]');
        if (!group) return;
        event.preventDefault();
        const blocks = getGroupBlocks(group);
        const indicator = document.createElement(group.matches('ul, ol') ? 'li' : 'div');
        indicator.className = 'block-drop-indicator';
        indicator.setAttribute('contenteditable', 'false');
        indicator.setAttribute('aria-hidden', 'true');
        block.after(indicator);
        block.classList.add('is-dragging');
        dragState = {
          block,
          group,
          handle: event.currentTarget,
          pointerId: event.pointerId,
          originalIndex: blocks.indexOf(block),
          indicator
        };
        event.currentTarget.setPointerCapture(event.pointerId);
        document.onpointermove = updateBlockDrag;
        document.onpointerup = finishBlockDrag;
        document.onpointercancel = finishBlockDrag;
      }

      function updateBlockDrag(event) {
        if (!dragState) return;
        const element = document.elementFromPoint(event.clientX, event.clientY);
        const target = element && element.closest('.editable-block');
        if (
          !target ||
          target === dragState.block ||
          target.closest('[data-sortable-group]') !== dragState.group
        ) return;
        const bounds = target.getBoundingClientRect();
        if (event.clientY < bounds.top + bounds.height / 2) {
          target.before(dragState.indicator);
        } else {
          target.after(dragState.indicator);
        }
      }

      function finishBlockDrag() {
        if (!dragState) return;
        const state = dragState;
        state.group.insertBefore(state.block, state.indicator);
        state.indicator.remove();
        state.block.classList.remove('is-dragging');
        state.handle.releasePointerCapture(state.pointerId);
        document.onpointermove = null;
        document.onpointerup = null;
        document.onpointercancel = null;
        dragState = null;
        if (getGroupBlocks(state.group).indexOf(state.block) !== state.originalIndex) {
          commitAtomicChange('顺序已更新');
        }
      }

      function moveBlockByKeyboard(block, direction) {
        const group = block.closest('[data-sortable-group]');
        if (!group) return;
        const blocks = getGroupBlocks(group);
        const index = blocks.indexOf(block);
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= blocks.length) return;
        if (direction < 0) group.insertBefore(block, blocks[targetIndex]);
        else group.insertBefore(blocks[targetIndex], block);
        block.querySelector(':scope > .block-drag-handle').focus();
        commitAtomicChange('顺序已更新');
      }

      function startBlockResize(event, block) {
        if (event.button !== undefined && event.button !== 0) return;
        event.preventDefault();
        resizeState = {
          block,
          handle: event.currentTarget,
          pointerId: event.pointerId,
          startY: event.clientY,
          startHeight: block.getBoundingClientRect().height,
          originalMinHeight: block.style.minHeight
        };
        block.classList.add('is-resizing');
        event.currentTarget.setPointerCapture(event.pointerId);
        document.onpointermove = updateBlockResize;
        document.onpointerup = finishBlockResize;
        document.onpointercancel = finishBlockResize;
      }

      function updateBlockResize(event) {
        if (!resizeState) return;
        const height = Math.max(
          MIN_BLOCK_HEIGHT,
          resizeState.startHeight + event.clientY - resizeState.startY
        );
        resizeState.block.style.minHeight = Math.round(height) + 'px';
        updatePageWarning();
      }

      function finishBlockResize() {
        if (!resizeState) return;
        const state = resizeState;
        const changed = state.block.style.minHeight !== state.originalMinHeight;
        state.block.classList.remove('is-resizing');
        state.handle.releasePointerCapture(state.pointerId);
        document.onpointermove = null;
        document.onpointerup = null;
        document.onpointercancel = null;
        resizeState = null;
        if (changed) commitAtomicChange('高度已更新');
      }

      function resetBlockHeight(block) {
        if (!block.style.minHeight) return;
        block.style.removeProperty('min-height');
        commitAtomicChange('已恢复自动高度');
      }

      function rebindInteractiveControls() {
        bindPhotoControls();
        bindEditableBlocks();
      }

      function updateHistoryButtons() {
        undoBtn.disabled = historyIndex <= 0;
        redoBtn.disabled = historyIndex >= history.length - 1;
      }

      function pushSnapshot() {
        if (applyingHistory) return;
        const snapshot = editor.innerHTML;
        if (history[historyIndex] === snapshot) return;
        history = history.slice(0, historyIndex + 1);
        history.push(snapshot);
        if (history.length > MAX_HISTORY) history.shift();
        historyIndex = history.length - 1;
        updateHistoryButtons();
      }

      function scheduleSnapshot() {
        window.clearTimeout(historyTimer);
        historyTimer = window.setTimeout(() => {
          historyTimer = 0;
          pushSnapshot();
        }, HISTORY_DELAY);
      }

      function flushPendingSnapshot() {
        if (!historyTimer) return;
        window.clearTimeout(historyTimer);
        historyTimer = 0;
        pushSnapshot();
      }

      function applyHistoryAt(index) {
        if (index < 0 || index >= history.length) return;
        applyingHistory = true;
        historyIndex = index;
        editor.innerHTML = history[historyIndex];
        rebindInteractiveControls();
        applyingHistory = false;
        updateHistoryButtons();
        saveDraft();
        updatePageWarning();
        editor.focus();
      }

      function undo() {
        flushPendingSnapshot();
        if (historyIndex > 0) applyHistoryAt(historyIndex - 1);
      }

      function redo() {
        flushPendingSnapshot();
        if (historyIndex < history.length - 1) applyHistoryAt(historyIndex + 1);
      }

      function commitAtomicChange(message) {
        setSaveStatus(message);
        pushSnapshot();
        saveDraft();
        updatePageWarning();
      }

      function resetToInitial() {
        if (!window.confirm('确定恢复推荐版本吗？当前编辑内容将被清除。')) return;
        window.clearTimeout(saveTimer);
        window.clearTimeout(historyTimer);
        saveTimer = 0;
        historyTimer = 0;
        editor.innerHTML = initialResumeHtml;
        rebindInteractiveControls();
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (error) {
          setSaveStatus('本地存储不可用');
        }
        history = [editor.innerHTML];
        historyIndex = 0;
        updateHistoryButtons();
        setSaveStatus('已恢复推荐版');
        updatePageWarning();
        editor.focus();
      }

      function updatePageWarning() {
        pageWarning.hidden = editor.scrollHeight <= editor.clientHeight + 4;
      }

      editor.addEventListener('input', () => {
        setSaveStatus('编辑中…');
        saveDraft();
        scheduleSnapshot();
        updatePageWarning();
      });

      editor.addEventListener('keydown', (event) => {
        const modifier = event.ctrlKey || event.metaKey;
        if (!modifier || event.key.toLowerCase() !== 'z') return;
        event.preventDefault();
        if (event.shiftKey) redo();
        else undo();
      });

      undoBtn.addEventListener('click', undo);
      redoBtn.addEventListener('click', redo);
      resetBtn.addEventListener('click', resetToInitial);
      printBtn.addEventListener('click', () => {
        if (
          unresolvedCount > 0 &&
          !window.confirm(`仍有 ${unresolvedCount} 项待核实内容。是否继续导出 PDF？`)
        ) return;
        window.print();
      });
      window.addEventListener('resize', updatePageWarning);
      window.addEventListener('beforeprint', updatePageWarning);

      restoreDraft();
      rebindInteractiveControls();
      history = [editor.innerHTML];
      historyIndex = 0;
      updateHistoryButtons();
      updatePageWarning();
    })();
  </script>
</body>
</html>
